[workspace]
resolver = "3"
members = [
    "core/meltemid",
    "core/mock-agent",
    "proto/meltemi-proto",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/meltemi/meltemi"
rust-version = "1.97"

[workspace.dependencies]
meltemi-proto = { path = "proto/meltemi-proto" }
