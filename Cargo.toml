[workspace]
resolver = "3"
members = [
    "core/meltemi-adapters",
    "core/meltemi-client",
    "core/meltemi-process",
    "core/meltemi-release",
    "core/meltemid",
    "core/meltemi-spec",
    "core/mock-agent",
    "core/mock-headless",
    "core/mock-provider",
    "desktop",
    "mobile",
    "proto/meltemi-proto",
    "tui",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/meltemi/meltemi"
rust-version = "1.97"

[workspace.dependencies]
meltemi-proto = { path = "proto/meltemi-proto" }
# The client-side stack (local transport, JSON-RPC peer, on-demand bootstrap,
# platform paths), shared by the daemon's server side, the terminal client and
# the desktop client (gui-tauri-paridad design D1; anticipated by cli-contrato
# design D6).
meltemi-client = { path = "core/meltemi-client" }
# The spec engine: parsing of `.meltemi/` and the pure context-projection
# compiler the daemon writes into agent instruction files.
meltemi-spec = { path = "core/meltemi-spec" }
# Process scopes: ending a launched process ends everything it launched. One
# `unsafe` module for the two layers that launch providers, rather than two
# copies of the same FFI (apagado-entero-y-modos design D2).
meltemi-process = { path = "core/meltemi-process" }
meltemid = { path = "core/meltemid" }

# All third-party dependencies are pinned exactly (constitution §10) and
# justified in the design of the change that introduces them.
agent-client-protocol = "=1.2.0"
# The async plumbing the ACP crate's own transport bases are written against.
# Already in the lockfile as that crate's dependency; this is a direct edge to a
# version the workspace already resolves, taken because the daemon now wires the
# agent's streams itself in order to scope its process
# (apagado-entero-y-modos design D3).
futures = "=0.3.32"
# TUI shell (tui-nucleo-ux design D6). ratatui re-exports its crossterm backend
# as `ratatui::crossterm`, so it is the single UI dependency; input is read on a
# dedicated blocking thread and forwarded to the async loop over a channel.
ratatui = "=0.29.0"
anyhow = "=1.0.103"
directories = "=6.0.0"
# Repository traversal honoring nested .gitignore (gestion-contexto-repo D1):
# the audited ecosystem standard; reimplementing gitignore by hand is a known
# nest of bugs.
ignore = "=0.4.23"
jsonschema = { version = "=0.47.0", default-features = false }
libc = "=0.2.186"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
# Desktop client shell (gui-tauri-paridad design D1/D2): native-webview app
# frame with deny-by-default capabilities; the webview never opens sockets —
# the Rust side owns the daemon connection via meltemi-client.
# The SSH client of the mobile companion, and of nothing else
# (companero-movil design D2). A phone has no system `ssh` to launch, so the app
# speaks the protocol itself. Apache-2.0, like this project; its REQUIRED tree is
# pure RustCrypto plus tokio and futures, which are already here — no TLS stack
# and no HTTP client enter with it.
#
# `default-features = false` is load-bearing, not tidiness: russh's defaults are
# `flate2`, `rsa` and **`aws-lc-rs`**, and that last one drags a C crypto library
# (`aws-lc-sys`, which wants NASM to build on Windows). The `deny.toml` ban on it
# caught exactly that the moment this dependency was added, which is what a ban
# is for.
#
# `ring` is then NOT optional-and-off, as the design first claimed: russh refuses
# to compile without one of its two backends. So `ring` it is — Apache-2.0 AND
# ISC, Rust and assembly with no C toolchain, and allowed in `deny.toml` only as
# a wrapper of `russh`. Without `rsa` and `flate2` the client speaks ed25519 and
# no compression, which is all this app needs.
russh = { version = "=0.63.3", default-features = false, features = ["ring"] }
# Already in the tree: `russh` pins exactly this version. Declared here only to
# turn ON its own `getrandom` feature, which is what exposes the system RNG the
# key generator needs — `rand_core` 0.10 moved `OsRng` out, and borrowing a
# different `rand_core` from elsewhere in the tree is how version skew starts.
# No new code enters with this line, only a feature of code already present.
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["ed25519", "getrandom"] }
tauri = "=2.11.5"
tauri-build = "=2.6.3"
# The official Tauri dialog plugin, for the native folder picker of "Open
# folder…" (lanzador-conversacional design D8). Consumed ONLY by the `desktop`
# crate and NOT exposed to the webview: the surface reaches it through a bespoke
# command, so `capabilities/default.json` stays at `core:default` and the daemon
# gains no dependency and no window of its own.
tauri-plugin-dialog = "=2.7.2"
# Desktop notifications (avisos-de-escritorio design D1): the OS notice that
# says WHAT happened, beside the attention request that only claims. Pinned and
# confined to the GUI client; the daemon links neither.
tauri-plugin-notification = "=2.3.3"
thiserror = "=2.0.18"
tokio = "=1.52.3"
toml = "=1.1.2"
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.23.4", features = ["v4"] }

[workspace.dependencies.windows-sys]
version = "=0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    # Process scopes (apagado-entero-y-modos design D2): a job object per
    # provider process, so ending it ends the whole tree a shim left behind.
    "Win32_System_JobObjects",
    "Win32_System_Threading",
]
