# cargo-deny configuration: license and advisory gates for the workspace.
# Constitution: minimal, pinned, justified dependencies; license and
# vulnerability auditing in CI.

[graph]
all-features = true

[advisories]
yanked = "deny"
# Informational "unmaintained" advisories carried by the Tauri 2 stack
# (gui-tauri-paridad design D2). None is a vulnerability; each is transitive
# under tauri/wry/tao and goes away when upstream migrates. Revisited on every
# tauri bump.
ignore = [
    # gtk-rs GTK3 bindings (Linux webview path): archived upstream; wry/tao
    # still bind GTK3 until their GTK4 migration lands.
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    # proc-macro-error: unmaintained, transitive of the gtk3 macro stack.
    "RUSTSEC-2024-0370",
    # paste: unmaintained macro helper, transitive of tauri's codegen.
    "RUSTSEC-2024-0436",
    # unic-*: unmaintained Unicode helpers, transitive of tauri's codegen.
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
    # zbus_names, zvariant, zvariant_derive: unmaintained as standalone crates
    # since zbus 6 folded them in as modules (z-galaxy/zbus#2043). None is a
    # vulnerability. They arrive through notify-rust, which still requires
    # zbus 5 at its latest release (4.18.2), under tauri-plugin-notification
    # 2.3.3, the latest stable, which the desktop links for its OS notices
    # (avisos-de-escritorio design D1). D-Bus is the Linux notification path
    # only. Revisited when the plugin or notify-rust moves to zbus 6.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # option-ext (pulled in by `directories`) is MPL-2.0; file-level
    # copyleft is compatible with Apache-2.0 distribution.
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies (private crates) carry no version by design;
# every external dependency stays pinned exactly.
allow-wildcard-paths = true

# No HTTP client and no TLS stack in the workspace (adaptadores-propios-acp
# design D2). The daemon owns no network transport (constitution §3) and the
# own adapters own none either: they spawn the provider's official CLI and
# speak newline-delimited JSON over stdio, so every byte that reaches a network
# leaves from the official binary, with the auth that binary manages (§2).
#
# `reqwest` is the single gate through which an HTTP stack can enter this tree,
# and only a shell's webview framework pulls it — the desktop's, and since
# `companero-movil` the companion's, which is the same `tauri` under another
# target. Naming `tauri` as its sole wrapper keeps that door where it is: any
# other crate — an adapter, the daemon, a future engine — that reaches for HTTP
# or TLS fails this gate and must argue for its exception here, in writing, as
# design D2 did.
[[bans.deny]]
crate = "reqwest"
wrappers = ["tauri"]
reason = "HTTP belongs to the provider's official binary, never to Meltemi's own processes"

[[bans.deny]]
crate = "hyper"
wrappers = ["reqwest", "hyper-util"]
reason = "reachable only under a shell's webview framework — the desktop's, and now the companion's"

# SSH is not HTTP and is not TLS, and that is why the mobile companion needs no
# TLS exception here (companero-movil design D2). The phone has no system `ssh`
# to launch, so the app speaks the protocol itself with `russh`.
#
# What russh DOES require is a crypto backend, and it offers exactly two: `ring`
# or `aws-lc-rs`. One of them is mandatory — the crate refuses to compile with
# neither — so this is a real exception, written here as D2 was amended to say,
# and not the clean "no exception needed" the design first claimed.
#
# `ring` is the one chosen, and `russh` is its ONLY permitted wrapper, exactly
# as `tauri` is `reqwest`'s. It is Apache-2.0 AND ISC, both already allowed; it
# is Rust and assembly with no C toolchain; and it builds for the Android
# targets. `aws-lc-rs` stays banned: it drags `aws-lc-sys`, a C library that
# wants NASM on Windows, and a C crypto stack is the thing this file exists to
# keep out.
[[bans.deny]]
crate = "ring"
wrappers = ["russh"]
reason = "the SSH client of the mobile companion needs one crypto backend; this one, there, and nowhere else"

[[bans.deny]]
crate = "aws-lc-rs"
reason = "it drags a C crypto library and its build toolchain; `ring` is the backend this workspace allows"

[[bans.deny]]
crate = "rustls"
reason = "no TLS stack in the workspace; the official CLI owns the transport"

[[bans.deny]]
crate = "native-tls"
reason = "no TLS stack in the workspace; the official CLI owns the transport"

[[bans.deny]]
crate = "openssl"
reason = "no TLS stack in the workspace; the official CLI owns the transport"

[[bans.deny]]
crate = "openssl-sys"
reason = "no TLS stack in the workspace; the official CLI owns the transport"

[[bans.deny]]
crate = "ureq"
reason = "no HTTP client in the workspace; the official CLI owns the transport"

[[bans.deny]]
crate = "curl"
reason = "no HTTP client in the workspace; the official CLI owns the transport"

[[bans.deny]]
crate = "isahc"
reason = "no HTTP client in the workspace; the official CLI owns the transport"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
