# SPDX-License-Identifier: Apache-2.0
[package]
name = "meltemi-client"
description = "Shared client-side stack for meltemid: local transport, JSON-RPC peer, on-demand bootstrap and platform paths"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
meltemi-proto.workspace = true
directories.workspace = true
# The user-scope endpoint, for a GUI launched from a desktop icon that never
# saw a shell's exported variable (via-ssh-del-cliente design D3). Already in
# the closure -- the daemon parses its configuration with it -- and pinned in
# the workspace, so nothing new enters the audit.
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# `process` for the `exec:` transport: a client that speaks the protocol
# through a command the user named (via-ssh-del-cliente design D1). `macros`
# for the stderr collector's task.
# `macros` and `rt` are what this crate already uses -- `select!` in the peer,
# and now a task for the error collector. They were reaching it only through
# another crate's features, so `cargo build -p meltemi-client` alone never
# worked; declaring them is honesty about what the code calls, not a new
# dependency (the crate is the same version, already pinned).
tokio = { workspace = true, features = [
    "net",
    "io-util",
    "sync",
    "time",
    "process",
    "rt",
    "macros",
] }
# The process scope, so a client that closes -- or dies outright -- leaves no
# `ssh` behind holding a remote session (design D7).
meltemi-process.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
# `test-util` is tokio's paused clock, for the bridge's own tests only: it is
# what proves that a switch during a backoff dials at once, by reaching the
# next dial without the clock having moved — instead of racing a wall-clock
# threshold on whatever runner CI hands out. Same pinned crate, dev-only.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
