# SPDX-License-Identifier: Apache-2.0
#
# Fleet registry snapshot (design catalogo-flota D1/D6).
#
# A versioned snapshot of the public ACP agent registry, curated per release
# from the public registry plus the internal integration research
# (docs/research/integracion-agentes.md). It is embedded into `meltemid` at
# build time (`include_str!`); populating the catalog never touches the
# network. Advanced users and tests substitute it with a local file via
# `MELTEMI_FLEET_REGISTRY` or the `fleet.registry` config key.
#
# Per entry:
#   id              stable catalog id, selectable via `agent.id` in config
#   name            human-readable product name (factual interoperability
#                   data; third-party names live here, never in specs)
#   level           declared Meltemi integration level: 1 native ACP,
#                   2 adapter, 3 structured headless, 4 artifacts. Declared,
#                   not verified — the conformance suite is a separate change.
#   bin             binary resolved on PATH; either one name for every OS or
#                   a per-OS table { default, windows?, macos?, linux? }. On
#                   Windows the executable extensions .exe/.cmd/.bat are
#                   probed (npm shims), so names stay extension-less.
#   acp-args        arguments that put the binary in ACP mode on stdio
#   candidate-paths well-known install locations probed besides PATH. Each entry
#                   is the FULL PATH OF THE BINARY, not the directory holding it
#                   (`~/.local/bin/claude`, never `~/.local/bin`): a directory
#                   here detects nothing, silently. `~/` expands to the user's
#                   home directory.
#   bundled         the entry's PILOT layer travels in Meltemi's own installers,
#                   so detection probes the directory beside the running daemon
#                   as well — after PATH and the candidate paths, never before
#                   (adaptadores-propios-acp D8). A bundled layer declares no
#                   install command: its remedy is to reinstall or repair
#                   Meltemi. Only a binary this project builds may be bundled;
#                   the provider's own CLI never is (§2).
#
# For level-2 entries, `bin` names the ACP adapter binary — the entry point
# meltemid can actually pilot today; the official CLI itself and the finer
# level semantics arrive with the conformance suite change.
#
# Install-route currency (fleet-catalog, "Vigencia de las rutas de instalación"):
# this revision REMOVES the two third-party `adapter-install` routes rather than
# re-verifying them — the pilot layer of both level-2 entries is now a binary
# Meltemi builds and ships. The only install commands that survive are the two
# `cli-install` ones, unchanged from the 2026-07-27 snapshot whose verification
# against the upstream distributions is recorded in the archived change
# `pulido-pre-anuncio` (`.verify.jsonl`, verified 2026-07-27 against the npm
# registry). No dead route survives this revision, because no third-party route
# survives it.

version = "2026-07-28"

[[agents]]
id = "gemini-cli"
name = "Gemini CLI"
level = 1
bin = "gemini"
acp-args = ["--acp"]
mcp = true
candidate-paths = []

[[agents]]
id = "copilot-cli"
name = "GitHub Copilot CLI"
level = 1
bin = "copilot"
acp-args = ["--acp", "--stdio"]
candidate-paths = []

[[agents]]
id = "cursor-cli"
name = "Cursor CLI"
level = 1
bin = "agent"
acp-args = ["acp"]
candidate-paths = []

[[agents]]
id = "kiro-cli"
name = "Kiro CLI"
level = 1
bin = "kiro-cli"
acp-args = ["acp"]
candidate-paths = []

[[agents]]
id = "kilo-code"
name = "Kilo Code"
level = 1
bin = "kilo"
acp-args = ["acp"]
candidate-paths = []

[[agents]]
id = "opencode"
name = "OpenCode"
level = 1
bin = "opencode"
acp-args = ["acp"]
candidate-paths = ["~/.opencode/bin/opencode"]

# Level 2: piloted through an ACP adapter. `bin` is what detection probes and
# the launcher runs (the adapter); `cli-bin` names the provider's own official
# CLI, so the fleet can say which of the two layers is missing instead of a bare
# "not detected" (flota-deteccion-guia D1). Both adapters here are Meltemi's own
# and travel in its installers (adaptadores-propios-acp D8), which is why they
# declare `bundled` and no install command. A third-party adapter remains
# perfectly pilotable — the user declares it with `[[fleet.custom]]` or a literal
# `agent.command`, and the daemon treats it like any other entry. What changed is
# that the registry no longer recommends one.
[[agents]]
id = "claude-code"
name = "Claude Code"
level = 2
bin = "meltemi-claude-acp"
adapter = "meltemi-claude-acp"
adapter-args = []
bundled = true
mcp = true
candidate-paths = []
cli-bin = "claude"
cli-candidate-paths = ["~/.local/bin/claude"]
cli-install = "npm i -g @anthropic-ai/claude-code"
legal-status = "grey"
legal-note = "Meltemi's own adapter pilots the official CLI with the session you already signed into — the safe path, never the provider's agent SDK, and never a mode that demands an API key. It stays grey because the provider has published no position on third-party orchestration of that CLI; if one appears, this note will cite it."

[[agents]]
id = "codex-cli"
name = "Codex CLI"
level = 2
bin = "meltemi-codex-acp"
adapter = "meltemi-codex-acp"
adapter-args = []
bundled = true
candidate-paths = []
cli-bin = "codex"
cli-candidate-paths = []
cli-install = "npm i -g @openai/codex"
legal-status = "tolerated"
legal-note = "Meltemi's own adapter drives the official CLI in the app-server mode the provider documents and published for third-party clients; the CLI authenticates itself, and no third-party package sits in between."

# Level 3: structured headless run. No rich permission channel, so it runs
# inside mandatory guardrails (bounded dir + native controls; design D2).
[[agents]]
id = "aider"
name = "Aider"
level = 3
bin = "aider"
headless = "aider"
headless-args = ["--no-pretty", "--yes-always"]
native-controls = ["--no-auto-commits"]
candidate-paths = []

# No ACP surface (level 4): context projection is the only channel; listed so
# the catalog states what exists and at which level.
[[agents]]
id = "antigravity"
name = "Antigravity"
level = 4
bin = "agy"
l4-target = "AGENTS.md"
candidate-paths = []
