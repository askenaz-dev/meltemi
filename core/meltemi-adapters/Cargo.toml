[package]
name = "meltemi-adapters"
description = "Meltemi's own ACP adapters: governed bridges over each provider's official CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "meltemi-claude-acp"
path = "src/bin/meltemi-claude-acp.rs"

[[bin]]
name = "meltemi-codex-acp"
path = "src/bin/meltemi-codex-acp.rs"

# No new workspace dependency (adaptadores-propios-acp design D2): the ACP side
# speaks the official crate, the provider side is a subprocess and newline
# JSON. Nothing here links an HTTP client or a TLS stack — deny.toml keeps
# that property auditable.
[dependencies]
agent-client-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
    "process",
    "sync",
    "time",
] }
# Already a pinned workspace dependency (the daemon mints ids with it), so no
# new name enters the workspace: the headless dialect dictates its session id to
# the CLI, whose session flag takes a UUID, instead of learning the id from an
# event that does not arrive until a turn has been sent
# (adaptadores-propios-acp 5.3).
uuid.workspace = true

[dev-dependencies]
# The conformance suite validates this crate's wire types against the provider's
# own dumped schema, the discipline `proto/` already practises with the same
# pinned validator. Test-only, and no new workspace dependency.
jsonschema.workspace = true
toml.workspace = true
