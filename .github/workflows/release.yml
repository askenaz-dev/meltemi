# SPDX-License-Identifier: Apache-2.0
name: Release

# Releases originate from a tag and its pipeline (docs/versionado.md). A red
# gate aborts the release: no artifact is published (docs/release.md).
on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Performance budget (constitution §12): the TUI binary stays under 25 MB.
  MELTEMI_TUI_BUDGET_BYTES: "26214400"
  # GUI installer budget (gui-tauri-paridad; foundational §12): under 15 MB
  # per platform — the OS webview is used or bootstrapped, never embedded.
  MELTEMI_GUI_INSTALLER_BUDGET_BYTES: "15728640"

jobs:
  gates:
    name: release gates (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Desktop system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - name: Desktop frontend install (locked)
        run: npm ci --prefix desktop/ui
      - name: Desktop frontend audit
        run: npm audit --prefix desktop/ui --audit-level=high
      # tauri::generate_context! embeds ui/dist at compile time.
      - name: Desktop frontend build
        run: npm run build --prefix desktop/ui

      # Hard gates — any failure aborts the release for every platform.
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --workspace --release

      # Performance budget gate (§12): the TUI binary size.
      - name: TUI size budget
        shell: bash
        run: |
          bin="target/release/meltemi"
          [ "${{ runner.os }}" = "Windows" ] && bin="target/release/meltemi.exe"
          size=$(wc -c < "$bin")
          echo "meltemi binary is $size bytes (budget ${MELTEMI_TUI_BUDGET_BYTES})"
          if [ "$size" -gt "${MELTEMI_TUI_BUDGET_BYTES}" ]; then
            echo "::error::TUI binary exceeds its §12 budget; aborting release"
            exit 1
          fi

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories sources bans

  package:
    name: package & checksums (${{ matrix.os }})
    needs: [gates, deny]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Desktop system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - name: Desktop frontend install (locked)
        run: npm ci --prefix desktop/ui
      - name: Desktop frontend build
        run: npm run build --prefix desktop/ui
      - name: Release build
        run: cargo build --workspace --release
      - name: Package and checksum
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist/meltemi-${{ runner.os }}.zip" ./target/release/meltemi.exe ./target/release/meltemid.exe
          else
            tar -czf "dist/meltemi-${{ runner.os }}.tar.gz" -C target/release meltemi meltemid
          fi
          cd dist
          # Publish a checksum for every artifact. The detached signature of
          # SHA256SUMS is produced with the maintainer's key (docs/release.md);
          # that signing step runs with the release secrets, not in this file.
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS; else shasum -a 256 * > SHA256SUMS; fi
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: meltemi-${{ runner.os }}
          path: dist/

  package-gui:
    name: GUI installers (${{ matrix.os }})
    needs: [gates, deny]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Desktop system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - name: Desktop frontend install (locked)
        run: npm ci --prefix desktop/ui
      # tauri build compiles the release binary and emits the per-platform
      # installers (MSI on Windows, DMG on macOS, AppImage+deb on Linux). The
      # webview is the OS's own (bootstrapped on Windows), never embedded.
      - name: Build GUI installers
        shell: bash
        # The tauri binary is called directly (not through `npm run`): nested
        # npm invocations pollute the hook's environment and cwd.
        run: cd desktop && ui/node_modules/.bin/tauri build
      # Budget gate (blocking): every installer stays under 15 MB.
      - name: GUI installer size budget
        shell: bash
        run: |
          shopt -s globstar nullglob
          found=0
          for installer in target/release/bundle/**/*.{msi,dmg,AppImage,deb}; do
            found=1
            size=$(wc -c < "$installer")
            echo "$installer is $size bytes (budget ${MELTEMI_GUI_INSTALLER_BUDGET_BYTES})"
            if [ "$size" -gt "${MELTEMI_GUI_INSTALLER_BUDGET_BYTES}" ]; then
              echo "::error::GUI installer exceeds its budget; aborting release"
              exit 1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no GUI installer was produced"
            exit 1
          fi
      - name: Collect and checksum
        shell: bash
        run: |
          mkdir -p dist-gui
          shopt -s globstar nullglob
          cp target/release/bundle/**/*.{msi,dmg,AppImage,deb} dist-gui/ 2>/dev/null || true
          cd dist-gui
          # Signed with the same custody as every release artifact: the
          # detached signature of SHA256SUMS is produced with the maintainer's
          # key outside this file (docs/release.md).
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS; else shasum -a 256 * > SHA256SUMS; fi
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: meltemi-gui-${{ runner.os }}
          path: dist-gui/
