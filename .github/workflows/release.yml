# SPDX-License-Identifier: Apache-2.0
name: Release

# Releases originate from a tag and its pipeline (docs/versionado.md). A red
# gate aborts the release: no artifact is published (docs/release.md).
#
# A push to main republishes the SITE only (sitio-web-producto D7): the release
# jobs are gated on a tag, the site lint stays a precondition, and the download
# links are version-free — so republishing content never desynchronizes them from
# the published release. (A path filter cannot be scoped per ref type in a single
# `push` trigger, so main runs the cheap site path unconditionally rather than
# risking a filtered tag.)
on:
  push:
    tags: ["v*.*.*"]
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Performance budget (constitution §12): the TUI binary stays under 25 MB.
  MELTEMI_TUI_BUDGET_BYTES: "26214400"
  # GUI installer budget (gui-tauri-paridad; foundational §12): under 15 MB
  # per platform — the OS webview is used or bootstrapped, never embedded.
  MELTEMI_GUI_INSTALLER_BUDGET_BYTES: "15728640"
  # Bundled ACP adapter budget (adaptadores-propios-acp): 6 MB per adapter.
  # Measured on 2026-07-28 at ~3.15 MB each (docs/qa/2026-07-28-adaptadores-
  # presupuesto.md), so the ceiling is roughly double what they cost today —
  # loose enough not to fail on ordinary growth, tight enough that a binary
  # which suddenly links a stack it must not have cannot slip into every
  # installer unnoticed. The categorical ban lives in deny.toml; this is the
  # measurement that keeps the claim honest.
  MELTEMI_ADAPTER_BUDGET_BYTES: "6291456"

jobs:
  gates:
    name: release gates (${{ matrix.os }})
    # The release pipeline belongs to a tag; a site-only push skips it.
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Desktop system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - name: Desktop frontend install (locked)
        run: npm ci --prefix desktop/ui
      - name: Desktop frontend audit
        run: npm audit --prefix desktop/ui --audit-level=high
      # tauri::generate_context! embeds ui/dist at compile time.
      - name: Desktop frontend build
        run: npm run build --prefix desktop/ui

      # Hard gates — any failure aborts the release for every platform.
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The debug build FIRST, like CI: the e2e fixtures spawn helper binaries
      # (mock-agent, mock-headless) resolved next to the test executable, and a
      # restored cache can carry fresh fingerprints without the linked binaries
      # — cargo then skips the relink and the fixtures find nothing. Building
      # explicitly makes the tree state deterministic before any test runs.
      - name: Build (workspace, debug)
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --workspace --release

      # Performance budget gate (§12): the TUI binary size.
      - name: TUI size budget
        shell: bash
        run: |
          bin="target/release/meltemi"
          [ "${{ runner.os }}" = "Windows" ] && bin="target/release/meltemi.exe"
          size=$(wc -c < "$bin")
          echo "meltemi binary is $size bytes (budget ${MELTEMI_TUI_BUDGET_BYTES})"
          if [ "$size" -gt "${MELTEMI_TUI_BUDGET_BYTES}" ]; then
            echo "::error::TUI binary exceeds its §12 budget; aborting release"
            exit 1
          fi

      # The two ACP adapters travel in every installer beside the daemon, so
      # their size is part of what a user downloads and is gated like the rest.
      - name: Adapter size budget
        shell: bash
        run: |
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          for name in meltemi-claude-acp meltemi-codex-acp; do
            bin="target/release/${name}${ext}"
            size=$(wc -c < "$bin")
            echo "$name is $size bytes (budget ${MELTEMI_ADAPTER_BUDGET_BYTES})"
            if [ "$size" -gt "${MELTEMI_ADAPTER_BUDGET_BYTES}" ]; then
              echo "::error::$name exceeds its budget; aborting release"
              exit 1
            fi
          done

  deny:
    name: cargo-deny
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories sources bans

  package:
    name: package & checksums (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: [gates, deny]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Desktop system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - name: Desktop frontend install (locked)
        run: npm ci --prefix desktop/ui
      - name: Desktop frontend build
        run: npm run build --prefix desktop/ui
      - name: Release build
        run: cargo build --workspace --release
      - name: Package and checksum
        shell: bash
        # Stable, version-free names per platform (sitio-web-producto D2): the
        # latest-release URL must resolve without anyone knowing the version.
        # The two ACP adapters ship beside the daemon on all three platforms
        # (adaptadores-propios-acp): detection probes the daemon's own directory
        # for them, so they must land in the same place the daemon does.
        run: |
          mkdir -p dist
          case "${{ runner.os }}" in
            Windows)
              7z a "dist/meltemi-Windows.zip" ./target/release/meltemi.exe ./target/release/meltemid.exe ./target/release/meltemi-claude-acp.exe ./target/release/meltemi-codex-acp.exe
              ;;
            macOS)
              tar -czf "dist/meltemi-macOS.tar.gz" -C target/release meltemi meltemid meltemi-claude-acp meltemi-codex-acp
              ;;
            Linux)
              tar -czf "dist/meltemi-Linux.tar.gz" -C target/release meltemi meltemid meltemi-claude-acp meltemi-codex-acp
              ;;
            *) echo "::error::unknown runner os"; exit 1 ;;
          esac
          # The installer scripts ship as release assets, so the site can link a
          # script whose checksum travels inside the signed SHA256SUMS instead of
          # hosting a copy of it.
          cp scripts/install.sh scripts/install.ps1 dist/
          cd dist
          # Publish a checksum for every artifact. The detached signature of
          # SHA256SUMS is produced with the maintainer's key (docs/release.md);
          # that signing step runs with the release secrets, not in this file.
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS; else shasum -a 256 * > SHA256SUMS; fi
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: meltemi-${{ runner.os }}
          path: dist/

  package-gui:
    name: GUI installers (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: [gates, deny]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Desktop system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - name: Desktop frontend install (locked)
        run: npm ci --prefix desktop/ui
      # tauri build compiles the release binary and emits the per-platform
      # installers (MSI on Windows, DMG on macOS, deb on Linux). The webview is
      # the OS's own — used, bootstrapped on Windows, or declared as a package
      # dependency on Linux — and never embedded, which is why no self-contained
      # format is built: an AppImage carries WebKitGTK and weighs ~79 MB
      # (instaladores-linux-sin-webview D1).
      - name: Build GUI installers
        shell: bash
        # The tauri binary is called directly (not through `npm run`): nested
        # npm invocations pollute the hook's environment and cwd.
        run: cd desktop && ui/node_modules/.bin/tauri build
      # Budget gate (blocking): every installer stays under 15 MB.
      - name: GUI installer size budget
        shell: bash
        run: |
          # `find`, not `**`: the macOS runners ship bash 3.2, which has no
          # `globstar` at all — `shopt -s globstar` there is a hard error under
          # `set -e`, which is exactly how this surfaced.
          # A file, not a heredoc and not a pipe: a heredoc body would have to
          # start at column 0 and break this YAML block, and a pipe would put the
          # loop in a subshell where `found` never comes back.
          list=installers.list
          find target/release/bundle -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*.deb' \) | sort > "$list"
          found=0
          while IFS= read -r installer; do
            found=1
            size=$(wc -c < "$installer")
            echo "$installer is $size bytes (budget ${MELTEMI_GUI_INSTALLER_BUDGET_BYTES})"
            if [ "$size" -gt "${MELTEMI_GUI_INSTALLER_BUDGET_BYTES}" ]; then
              echo "::error::GUI installer exceeds its budget; aborting release"
              exit 1
            fi
          done < "$list"
          if [ "$found" -eq 0 ]; then
            echo "::error::no GUI installer was produced"
            exit 1
          fi
      - name: Collect, normalize names and checksum
        shell: bash
        # The bundler embeds the version in each installer name; the stable
        # scheme is what the site links, so rename before publishing and let the
        # checksum be the one of the stable name (sitio-web-producto D2).
        run: |
          mkdir -p dist-gui
          shopt -s nullglob   # no globstar: bash 3.2 on the macOS runners lacks it
          normalize() {
            src="$1"; dest="$2"
            [ -e "$src" ] || return 0
            cp "$src" "dist-gui/$dest"
            echo "normalized $(basename "$src") -> $dest"
          }
          case "${{ runner.os }}" in
            Windows)
              for f in target/release/bundle/msi/*.msi; do normalize "$f" "meltemi-desktop-Windows.msi"; done
              ;;
            macOS)
              for f in target/release/bundle/dmg/*.dmg; do normalize "$f" "meltemi-desktop-macOS.dmg"; done
              ;;
            Linux)
              for f in target/release/bundle/deb/*.deb; do normalize "$f" "meltemi-desktop-Linux.deb"; done
              ;;
          esac
          if [ -z "$(ls -A dist-gui)" ]; then
            echo "::error::no installer was normalized for ${{ runner.os }}"
            exit 1
          fi
          cd dist-gui
          # Signed with the same custody as every release artifact: the
          # detached signature of SHA256SUMS is produced with the maintainer's
          # key outside this file (docs/release.md).
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS; else shasum -a 256 * > SHA256SUMS; fi
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: meltemi-gui-${{ runner.os }}
          path: dist-gui/

  # Assembles the DRAFT release: every artifact of the six packaging jobs under
  # ONE merged SHA256SUMS, so the stable-name URLs the site and the README
  # promise (`releases/latest/download/<asset>`) have something to resolve to.
  # It stays a draft on purpose: the maintainer downloads SHA256SUMS, signs it
  # with the key CI never holds, uploads `SHA256SUMS.minisig` and publishes
  # (docs/release.md) — a red gate upstream means this job never runs and
  # nothing is published, not even as a draft.
  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [gates, deny, package, package-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The provenance mint (procedencia-de-release): id-token for the OIDC
      # token behind the Sigstore signing certificate, attestations to persist
      # the attestation, artifact-metadata for the artifact storage record.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: collected
      - name: Merge artifacts under one checksum file
        shell: bash
        # The per-OS SHA256SUMS are working files of their packaging jobs; the
        # published truth is ONE file computed over the merged set (the installer
        # scripts appear identically in all three core artifacts — first copy
        # wins). Any name collision with DIFFERENT content is a packaging bug
        # and must abort, not be papered over.
        run: |
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [ -e "release-assets/$name" ]; then
              if ! cmp -s "$file" "release-assets/$name"; then
                echo "::error::asset name collision with different content: $name"
                exit 1
              fi
              continue
            fi
            cp "$file" "release-assets/$name"
          done < <(find collected -type f ! -name 'SHA256SUMS' -print0)
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      # Build provenance over the same file the maintainer signs: the subjects
      # are the entries of the merged SHA256SUMS, so one attestation covers
      # every published asset exactly as the one detached signature does. This
      # job only aggregates what the packaging jobs built, so the attestation
      # ties the published set to this workflow and commit — it does not attest
      # each build step (docs/release.md says so too, in the same words).
      # Pinned by commit, not by a floating tag (§10): this step mints with the
      # job's OIDC identity, and a moved tag must not be able to move it.
      - name: Attest provenance of the merged checksums
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: release-assets/SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "Meltemi $GITHUB_REF_NAME" \
            --notes "Draft pending signature: the maintainer verifies these artifacts, signs SHA256SUMS with the project key and attaches SHA256SUMS.minisig before publishing. Checksums cover every asset, including the installer scripts. To verify a download, follow docs/release.md - it carries the public key and the three checks: checksum, signature, provenance." \
            release-assets/*

  # The site lint is a precondition of publishing on both paths: a tagged
  # release and a content-only push to main.
  site-lint:
    name: site lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Site lint
        run: cargo test -p meltemid --test site

  # The product site is published only after the gates and the packaging have
  # published their artifacts: the site must never announce a release whose
  # artifacts were not published (sitio-web-producto D7). A red gate leaves the
  # previous edition of the site untouched, because this condition is false.
  publish-site:
    name: publish site
    needs: [site-lint, gates, deny, package, package-gui]
    if: >-
      !cancelled() &&
      needs.site-lint.result == 'success' &&
      (
        !startsWith(github.ref, 'refs/tags/') ||
        (needs.gates.result == 'success' &&
         needs.deny.result == 'success' &&
         needs.package.result == 'success' &&
         needs['package-gui'].result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Marks come from brand/ (single source): they are staged into the
      # artifact, never committed as copies under site/.
      - name: Stage brand marks
        run: |
          mkdir -p site/media
          cp brand/meltemi-mark-gradient.svg site/media/
          cp brand/meltemi-lockup-dark.svg site/media/
          cp brand/meltemi-lockup-light.svg site/media/
      # `enablement` lets the workflow turn Pages on itself: without it the very
      # first publication fails on a repository where nobody clicked the setting,
      # which is a poor way to greet a fresh clone or a fork.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
