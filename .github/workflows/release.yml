# SPDX-License-Identifier: Apache-2.0
name: Release

# A release originates from a push to main that carries a new version
# (release-con-el-push D1; docs/versionado.md). The `version` job asks
# `meltemi-release gate` whether this commit opens the release path, and every
# other job runs only when it says yes. The pipeline creates the tag on that
# very commit; no tag starts this workflow, so a tag pushed by hand publishes
# nothing. A red gate aborts the release: no artifact is published
# (docs/release.md).
#
# A dispatch re-runs a publication that failed half-way, and is honoured from
# main only.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# One release at a time: two pushes close together must not race to create the
# same tag.
concurrency:
  group: release
  cancel-in-progress: false

# Read-only by default; the jobs that publish raise their own permissions and
# no other job may (release-con-el-push D5).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Performance budget (constitution §12): the TUI binary stays under 25 MB.
  MELTEMI_TUI_BUDGET_BYTES: "26214400"
  # GUI installer budget (gui-tauri-paridad; foundational §12): under 15 MB
  # per platform — the OS webview is used or bootstrapped, never embedded.
  MELTEMI_GUI_INSTALLER_BUDGET_BYTES: "15728640"
  # Bundled ACP adapter budget (adaptadores-propios-acp): 6 MB per adapter.
  # Measured on 2026-07-28 at ~3.15 MB each (docs/qa/2026-07-28-adaptadores-
  # presupuesto.md), so the ceiling is roughly double what they cost today —
  # loose enough not to fail on ordinary growth, tight enough that a binary
  # which suddenly links a stack it must not have cannot slip into every
  # installer unnoticed. The categorical ban lives in deny.toml; this is the
  # measurement that keeps the claim honest.
  MELTEMI_ADAPTER_BUDGET_BYTES: "6291456"

jobs:
  # The release gate (release-con-el-push D1, D5): this commit's version must
  # agree in every carrier, have no tag, be newer than every version tag, and
  # the commit must be on main. The answer is the condition of every other job.
  # Carriers that disagree fail this job, so the run turns red instead of
  # quietly publishing nothing.
  version:
    name: release gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.gate.outputs.release }}
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Every tag and origin/main: the gate compares against all of them.
          fetch-depth: 0
      - name: Show toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Ask the gate
        id: gate
        shell: bash
        run: |
          cargo run --quiet --locked -p meltemi-release -- gate --commit "$GITHUB_SHA" --main origin/main > gate.txt
          cat gate.txt >> "$GITHUB_OUTPUT"
          {
            echo '### Release gate'
            echo
            echo '```'
            cat gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat gate.txt
      # The release's notes are the version's section of CHANGELOG.md when it
      # has one, and generated otherwise (release-con-el-push D4). Taken here,
      # where the toolchain already is, and handed to the publish job.
      - name: The release notes
        id: notes
        if: steps.gate.outputs.release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set +e
          cargo run --quiet --locked -p meltemi-release -- notes "$VERSION" > release-notes.md
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "notes=changelog" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 3 ]; then
            echo "CHANGELOG.md has no section for $VERSION: the notes will be generated"
            echo "notes=generated" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.notes.outputs.notes == 'changelog'
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7
          if-no-files-found: error

  gates:
    name: release gates (${{ matrix.os }})
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Show toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Desktop system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - name: Desktop frontend install (locked)
        run: npm ci --prefix desktop/ui
      - name: Desktop frontend audit
        run: npm audit --prefix desktop/ui --audit-level=high
      # tauri::generate_context! embeds ui/dist at compile time.
      - name: Desktop frontend build
        run: npm run build --prefix desktop/ui

      # Hard gates — any failure aborts the release for every platform.
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The debug build FIRST, like CI: the e2e fixtures spawn helper binaries
      # (mock-agent, mock-headless) resolved next to the test executable, and a
      # restored cache can carry fresh fingerprints without the linked binaries
      # — cargo then skips the relink and the fixtures find nothing. Building
      # explicitly makes the tree state deterministic before any test runs.
      - name: Build (workspace, debug)
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --workspace --release

      # Performance budget gate (§12): the TUI binary size.
      - name: TUI size budget
        shell: bash
        run: |
          bin="target/release/meltemi"
          [ "${{ runner.os }}" = "Windows" ] && bin="target/release/meltemi.exe"
          size=$(wc -c < "$bin")
          echo "meltemi binary is $size bytes (budget ${MELTEMI_TUI_BUDGET_BYTES})"
          if [ "$size" -gt "${MELTEMI_TUI_BUDGET_BYTES}" ]; then
            echo "::error::TUI binary exceeds its §12 budget; aborting release"
            exit 1
          fi

      # The two ACP adapters travel in every installer beside the daemon, so
      # their size is part of what a user downloads and is gated like the rest.
      - name: Adapter size budget
        shell: bash
        run: |
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          for name in meltemi-claude-acp meltemi-codex-acp; do
            bin="target/release/${name}${ext}"
            size=$(wc -c < "$bin")
            echo "$name is $size bytes (budget ${MELTEMI_ADAPTER_BUDGET_BYTES})"
            if [ "$size" -gt "${MELTEMI_ADAPTER_BUDGET_BYTES}" ]; then
              echo "::error::$name exceeds its budget; aborting release"
              exit 1
            fi
          done

  deny:
    name: cargo-deny
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses advisories sources bans

  package:
    name: package & checksums (${{ matrix.os }})
    if: needs.version.outputs.release == 'true'
    needs: [version, gates, deny]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Desktop system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - name: Desktop frontend install (locked)
        run: npm ci --prefix desktop/ui
      - name: Desktop frontend build
        run: npm run build --prefix desktop/ui
      - name: Release build
        run: cargo build --workspace --release
      - name: Package and checksum
        shell: bash
        # Stable, version-free names per platform (sitio-web-producto D2): the
        # latest-release URL must resolve without anyone knowing the version.
        # The two ACP adapters ship beside the daemon on all three platforms
        # (adaptadores-propios-acp): detection probes the daemon's own directory
        # for them, so they must land in the same place the daemon does.
        run: |
          mkdir -p dist
          case "${{ runner.os }}" in
            Windows)
              7z a "dist/meltemi-Windows.zip" ./target/release/meltemi.exe ./target/release/meltemid.exe ./target/release/meltemi-claude-acp.exe ./target/release/meltemi-codex-acp.exe
              ;;
            macOS)
              tar -czf "dist/meltemi-macOS.tar.gz" -C target/release meltemi meltemid meltemi-claude-acp meltemi-codex-acp
              ;;
            Linux)
              tar -czf "dist/meltemi-Linux.tar.gz" -C target/release meltemi meltemid meltemi-claude-acp meltemi-codex-acp
              ;;
            *) echo "::error::unknown runner os"; exit 1 ;;
          esac
          # The installer scripts ship as release assets, so the site can link a
          # script whose checksum travels inside the signed SHA256SUMS instead of
          # hosting a copy of it.
          cp scripts/install.sh scripts/install.ps1 dist/
          cd dist
          # Publish a checksum for every artifact. The detached signature of
          # SHA256SUMS is produced with the maintainer's key (docs/release.md);
          # that signing step runs with the release secrets, not in this file.
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS; else shasum -a 256 * > SHA256SUMS; fi
          cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meltemi-${{ runner.os }}
          path: dist/

  package-gui:
    name: GUI installers (${{ matrix.os }})
    if: needs.version.outputs.release == 'true'
    needs: [version, gates, deny]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Desktop system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - name: Desktop frontend install (locked)
        run: npm ci --prefix desktop/ui
      # tauri build compiles the release binary and emits the per-platform
      # installers (MSI on Windows, DMG on macOS, deb on Linux). The webview is
      # the OS's own — used, bootstrapped on Windows, or declared as a package
      # dependency on Linux — and never embedded, which is why no self-contained
      # format is built: an AppImage carries WebKitGTK and weighs ~79 MB
      # (instaladores-linux-sin-webview D1).
      - name: Build GUI installers
        shell: bash
        # The tauri binary is called directly (not through `npm run`): nested
        # npm invocations pollute the hook's environment and cwd.
        run: cd desktop && ui/node_modules/.bin/tauri build
      # Budget gate (blocking): every installer stays under 15 MB.
      - name: GUI installer size budget
        shell: bash
        run: |
          # `find`, not `**`: the macOS runners ship bash 3.2, which has no
          # `globstar` at all — `shopt -s globstar` there is a hard error under
          # `set -e`, which is exactly how this surfaced.
          # A file, not a heredoc and not a pipe: a heredoc body would have to
          # start at column 0 and break this YAML block, and a pipe would put the
          # loop in a subshell where `found` never comes back.
          list=installers.list
          find target/release/bundle -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*.deb' \) | sort > "$list"
          found=0
          while IFS= read -r installer; do
            found=1
            size=$(wc -c < "$installer")
            echo "$installer is $size bytes (budget ${MELTEMI_GUI_INSTALLER_BUDGET_BYTES})"
            if [ "$size" -gt "${MELTEMI_GUI_INSTALLER_BUDGET_BYTES}" ]; then
              echo "::error::GUI installer exceeds its budget; aborting release"
              exit 1
            fi
          done < "$list"
          if [ "$found" -eq 0 ]; then
            echo "::error::no GUI installer was produced"
            exit 1
          fi
      - name: Collect, normalize names and checksum
        shell: bash
        # The bundler embeds the version in each installer name; the stable
        # scheme is what the site links, so rename before publishing and let the
        # checksum be the one of the stable name (sitio-web-producto D2).
        run: |
          mkdir -p dist-gui
          shopt -s nullglob   # no globstar: bash 3.2 on the macOS runners lacks it
          normalize() {
            src="$1"; dest="$2"
            [ -e "$src" ] || return 0
            cp "$src" "dist-gui/$dest"
            echo "normalized $(basename "$src") -> $dest"
          }
          case "${{ runner.os }}" in
            Windows)
              for f in target/release/bundle/msi/*.msi; do normalize "$f" "meltemi-desktop-Windows.msi"; done
              ;;
            macOS)
              for f in target/release/bundle/dmg/*.dmg; do normalize "$f" "meltemi-desktop-macOS.dmg"; done
              ;;
            Linux)
              for f in target/release/bundle/deb/*.deb; do normalize "$f" "meltemi-desktop-Linux.deb"; done
              ;;
          esac
          if [ -z "$(ls -A dist-gui)" ]; then
            echo "::error::no installer was normalized for ${{ runner.os }}"
            exit 1
          fi
          cd dist-gui
          # Signed with the same custody as every release artifact: the
          # detached signature of SHA256SUMS is produced with the maintainer's
          # key outside this file (docs/release.md).
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS; else shasum -a 256 * > SHA256SUMS; fi
          cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meltemi-gui-${{ runner.os }}
          path: dist-gui/

  # Publishes the release, with nobody in between (release-con-el-push D3,
  # D4). The artifacts of the six packaging jobs go under ONE merged
  # SHA256SUMS; the attestation over its entries is the release's signature,
  # and its bundle travels as an asset so a download can be verified offline.
  # Immutable releases accept no asset once published, so everything is
  # uploaded to a draft first and the draft is published last. A draft does not
  # create its tag: if this job fails half-way the tag does not exist yet, and a
  # dispatch, or a re-run, finds the draft and finishes it.
  publish:
    name: publish the release
    if: needs.version.outputs.release == 'true'
    needs: [version, gates, deny, package, package-gui]
    runs-on: ubuntu-latest
    # The only jobs that may see a publication credential run in this
    # environment, and it admits main only (release-con-el-push D5).
    environment: release
    permissions:
      contents: write
      # The provenance mint: id-token for the OIDC token behind the Sigstore
      # signing certificate, attestations to persist the attestation,
      # artifact-metadata for the artifact storage record.
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # The packaging jobs' artifacts only: meltemi-<os> and meltemi-gui-<os>.
          pattern: meltemi-*
          path: collected
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.version.outputs.notes == 'changelog'
        with:
          name: release-notes
          path: notes
      - name: Merge artifacts under one checksum file
        shell: bash
        # The per-OS SHA256SUMS are working files of their packaging jobs; the
        # published truth is ONE file computed over the merged set (the installer
        # scripts appear identically in all three core artifacts — first copy
        # wins). Any name collision with DIFFERENT content is a packaging bug
        # and must abort, not be papered over.
        run: |
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [ -e "release-assets/$name" ]; then
              if ! cmp -s "$file" "release-assets/$name"; then
                echo "::error::asset name collision with different content: $name"
                exit 1
              fi
              continue
            fi
            cp "$file" "release-assets/$name"
          done < <(find collected -type f ! -name 'SHA256SUMS' -print0)
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      # The signature of the release: one attestation whose subjects are the
      # entries of the merged SHA256SUMS, so it covers every published asset.
      # This job only aggregates what the packaging jobs built, so it ties the
      # published set to this workflow and commit; it does not attest each
      # build step (docs/release.md says so in the same words). Pinned by
      # commit: this step mints with the job's OIDC identity.
      - name: Attest provenance of the merged checksums
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: release-assets/SHA256SUMS
      # The bundle verifies itself against the public log, so it sits beside
      # the assets it attests rather than inside SHA256SUMS.
      - name: Keep the attestation bundle as an asset
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" release-assets/attestation.sigstore.json
      - name: Create or reuse the draft
        id: draft
        shell: bash
        # The tag does not exist yet: the gate refused any version that has one,
        # and a draft does not create it. The release is created on the commit
        # that passed the gates; a draft left by a failed run is reused.
        run: |
          state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          case "$state" in
            false)
              echo "$TAG is already published: nothing to upload"
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            true)
              echo "a draft of $TAG exists: it is completed"
              ;;
            missing)
              if [ -s notes/release-notes.md ]; then
                notes=(--notes-file notes/release-notes.md)
              else
                notes=(--generate-notes)
              fi
              gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Meltemi $TAG" "${notes[@]}"
              ;;
            *)
              echo "::error::unexpected state of $TAG: $state"
              exit 1
              ;;
          esac
      - name: Upload every asset to the draft
        if: steps.draft.outputs.published != 'true'
        shell: bash
        # --clobber makes a re-run idempotent: an asset a failed upload left
        # half-written is replaced. Allowed on a draft, refused once published.
        run: gh release upload "$TAG" release-assets/* --clobber
      - name: Publish the draft
        if: steps.draft.outputs.published != 'true'
        shell: bash
        run: gh release edit "$TAG" --draft=false --latest
      - name: Check what was published
        shell: bash
        # Nothing may be missing once published: immutable releases would never
        # accept it afterwards.
        run: |
          published="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          missing=0
          for file in release-assets/*; do
            name="$(basename "$file")"
            if ! grep -qxF "$name" <<< "$published"; then
              echo "::error::$TAG was published without $name"
              missing=1
            fi
          done
          [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "false" ] || { echo "::error::$TAG is still a draft"; exit 1; }
          exit "$missing"
