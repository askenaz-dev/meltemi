name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # rustup picks up the pinned toolchain from rust-toolchain.toml
      # automatically on first cargo invocation.
      - name: Show toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # The desktop client (Tauri) needs the platform webview stack on Linux;
      # cargo --workspace gates compile it, so the deps live in this job.
      - name: Desktop system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      - name: Desktop frontend install (locked)
        run: npm ci --prefix desktop/ui

      # Frontend dependencies are audited like the Rust ones (constitution
      # §10); cargo-deny does not cover npm.
      - name: Desktop frontend audit
        run: npm audit --prefix desktop/ui --audit-level=high

      - name: Desktop frontend check
        run: npm run check --prefix desktop/ui

      # Every visible string routes through the ES/EN catalog (§11).
      - name: Desktop i18n lint
        run: npm run lint:i18n --prefix desktop/ui

      # The palette's typed forms are generated from the contract schemas: a
      # contract change that is not regenerated must fail here, never ship a
      # form that lies about the method it invokes.
      - name: Desktop method forms freshness
        run: npm run check:forms --prefix desktop/ui

      # Pure surface logic (fuzzy matching, entity identity) under Node's own
      # test runner: no test framework dependency.
      - name: Desktop frontend tests
        run: npm test --prefix desktop/ui

      # tauri::generate_context! embeds ui/dist at compile time, so the
      # frontend build precedes every cargo gate that compiles desktop/.
      - name: Desktop frontend build
        run: npm run build --prefix desktop/ui

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  deny:
    name: cargo-deny (licenses & advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories sources bans
