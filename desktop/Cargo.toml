# SPDX-License-Identifier: Apache-2.0
[package]
name = "meltemi-desktop"
description = "Meltemi desktop client: a thin Tauri surface over the meltemid daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "meltemi_desktop"
path = "src/lib.rs"

[[bin]]
name = "meltemi-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# Project search honoring nested .gitignore, same crate the daemon's repo map
# uses (already pinned in the workspace).
ignore.workspace = true
meltemi-client.workspace = true
meltemi-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    # The BYO-LSP hub spawns the user's language servers.
    "process",
] }

[dev-dependencies]
# The bridge tests spawn an in-process daemon over the real transport, the
# same harness the TUI e2e suite uses.
meltemid.workspace = true
