# SPDX-License-Identifier: Apache-2.0
[package]
name = "meltemi-mobile"
description = "Meltemi mobile companion: the Agent Boss's remote post, over the user's own SSH"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "meltemi_mobile"
# `cdylib` is what Android loads; `rlib` is what the tests link.
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
meltemi-client.workspace = true
meltemi-proto.workspace = true
# The SSH client lives HERE and nowhere else: on the desktop the `ssh` is the
# user's own, and that does not change (design D2).
russh.workspace = true
ssh-key.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
